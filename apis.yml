name: Overstory
description: >-
  Overstory provides AI-powered vegetation intelligence for electric utilities and
  grid operators. The platform fuses high-resolution satellite and aerial imagery with
  machine learning to detect vegetation encroachment, hazard trees, and wildfire risk
  along power line corridors, helping utilities prioritize trimming, optimize
  vegetation management spend, and improve grid reliability (SAIDI). Overstory was
  founded as 20tree.ai and surfaced in the API Evangelist network as a Techstars
  portfolio company. As of this profile the company delivers its intelligence through
  a customer platform and services rather than a public developer API; no public API
  documentation, OpenAPI, or developer portal was found during enrichment.
